<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ settings.project_title }}</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ui.css') }}">
</head>

<body>

<!-- BLOCK 1 - TOP BAR -->
<header class="topbar">

    <div class="brand">
        <div class="brand__logo-box">
            <img class="brand__logo-img"
                 src="{{ url_for('static', filename=settings.logo_path) }}"
                 alt="Project logo"
                 onerror="this.style.display='none'">
        </div>

        <div class="brand__text-box">
            <h1 class="brand__title">{{ settings.project_title }}</h1>
            <p class="brand__subtitle">{{ settings.project_subtitle }}</p>
        </div>
    </div>

    <button class="hamburger" id="btnOpenMenu" aria-label="Open menu">
        <span></span><span></span><span></span>
    </button>
</header>


<!-- BLOCK 2 - THE MAP BOARD -->
<main class="map-board" id="mapBoard">

    <!-- ----- BLOCK 2a - THE STATISTICS BAR ----- -->
    <div class="stats-bar is-hidden" id="statsBar">
        <span class="stats-bar__item">
            {{ settings.stat_total_label }} <b id="statTotalShips">0</b>
        </span>
        <span class="stats-bar__item">
            {{ settings.stat_dark_label }} <b id="statDarkVessels">0</b>
        </span>

        <span class="stats-bar__scene" id="statSceneName"></span>

        <button class="stats-bar__close" id="btnCloseScene"
                aria-label="Close this scene">&times;</button>
    </div>

    <!-- ----- BLOCK 2b - THE MAP AND THE CARDS FLOATING OVER IT ----- -->
    <div class="map-board__map-area">

        <div id="map" class="map-board__map"></div>

        <div class="notice is-hidden" id="notice" role="status" aria-live="polite">
            <span class="notice__dot" aria-hidden="true"></span>
            <span class="notice__text" id="noticeText"></span>
        </div>

        <aside class="ship-card is-hidden" id="shipCard">
            <div class="ship-card__head">
                <h2 class="ship-card__title">{{ settings.ship_details_title }}</h2>
                <button class="ship-card__close" id="btnCloseShipCard"
                        aria-label="Close the ship details">&times;</button>
            </div>
            <dl class="ship-card__rows" id="shipCardRows"></dl>
        </aside>
    </div>

    <!-- ----- BLOCK 2c - THE CONTROL BAR ----- -->
    <div class="controls">

        <button class="control-button" id="btnPickScene" aria-pressed="false"
                title="{{ settings.btn_select_title }}"
                aria-label="{{ settings.btn_select_title }}">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17v3z"></path>
                <line x1="14.5" y1="7.5" x2="17.5" y2="10.5"></line>
            </svg>
        </button>

        <button class="control-button" id="btnSarOverlay" aria-pressed="false" disabled
                title="{{ settings.btn_sar_title }}"
                aria-label="{{ settings.btn_sar_title }}">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <polygon points="12 3 22 8 12 13 2 8 12 3"></polygon>
                <polyline points="2 13 12 18 22 13"></polyline>
                <polyline points="2 17.5 12 22.5 22 17.5"></polyline>
            </svg>
        </button>

        <div class="switch-group is-disabled" id="switchDarkOnlyGroup">
            <span class="switch-group__label" id="switchDarkOnlyLabel">{{ settings.toggle_dark_label }}</span>
            <button class="switch" id="switchDarkOnly" role="switch" disabled
                    aria-checked="false" aria-labelledby="switchDarkOnlyLabel">
                <span class="switch__knob" aria-hidden="true"></span>
            </button>
        </div>
    </div>
</main>


<!-- BLOCK 3 - SIDEBAR MENU -->
<div class="sidebar-backdrop is-hidden" id="sidebarBackdrop"></div>

<nav class="sidebar" id="sidebar">
    <button class="sidebar__close" id="btnCloseMenu" aria-label="Close menu">&times;</button>

    <button class="sidebar__btn is-current" id="btnMenuScenes">SAR Scenes</button>

    <a class="sidebar__btn" id="linkAisArchive"
       href="{{ settings.link_ais_archive }}">AIS Database Archive</a>

    <button class="sidebar__btn" id="btnMenuDarkAlerts">Dark Vessel Alerts</button>
</nav>


<!-- BLOCK 4 - POPUP -->
<div class="popup-overlay is-hidden" id="popupOverlay">
    <div class="popup">
        <p class="popup__message" id="popupMessage">Under construction!</p>
        <button class="popup__close" id="btnClosePopup">OK</button>
    </div>
</div>


<!-- BLOCK 5 - THE LOADING ANIMATION -->
<div class="loader-overlay is-hidden" id="loaderOverlay"
     role="status" aria-live="polite" aria-busy="true">
    <div class="loader">
        <img class="loader__anim"
             src="{{ url_for('static', filename=settings.loading_animation_path) }}"
             alt=""
             onerror="this.style.display='none'">
        <p class="loader__text" id="loaderText">{{ settings.loading_text }}</p>
    </div>
</div>


<!-- BLOCK 6 - SETTINGS FROM app.py, AND THE PAGE LOGIC -->
<script>
    const BAKLAVA_SETTINGS = {{ settings | tojson }};
</script>

<script src="{{ url_for('static', filename='js/baklava.js') }}"></script>

</body>
</html>
