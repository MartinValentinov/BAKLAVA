<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ settings.project_title }}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/landing.css') }}">
</head>

<body class="landing">

<main class="landing__stage">
    <img class="landing__logo"
         src="{{ url_for('static', filename=settings.logo_path) }}"
         alt="{{ settings.project_title }}"
         onerror="this.style.display='none'">

    <h1 class="landing__title">{{ settings.project_title }}</h1>
    <p class="landing__subtitle">{{ settings.project_subtitle }}</p>

    <a class="landing__cta" href="{{ url_for('map_view') }}">{{ settings.landing_cta }}</a>

    <nav class="landing__links">
        <a class="landing__link" href="{{ settings.link_demo }}">Pipeline walkthrough</a>
        <span class="landing__dot" aria-hidden="true">·</span>
        <a class="landing__link" href="{{ settings.link_ais_archive }}"
           target="_blank" rel="noopener noreferrer">Live AIS</a>
    </nav>
</main>

</body>
</html>
